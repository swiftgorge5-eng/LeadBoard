name: Restart LeadBoard

on:
  push:
    paths:
      - ".github/workflows/restart-leadboard.yml"

permissions:
  contents: read

jobs:
  restart:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Restart service and verify health
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl restart leadboard.service
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/health | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = "1"
          curl -fsS --max-time 5 http://127.0.0.1/health | grep -q '"status":"ok"'
          echo "LeadBoard restarted with current EnvironmentFile."
