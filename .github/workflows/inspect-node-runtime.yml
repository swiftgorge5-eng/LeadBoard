name: Inspect Node Runtime

on:
  push:
    paths:
      - ".github/workflows/inspect-node-runtime.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Inspect Node installations
        shell: bash
        run: |
          set +e
          echo "system node: $(command -v node)"
          node --version
          npm --version
          echo "leadboard-node:"
          ls -l /usr/local/bin/leadboard-node
          /usr/local/bin/leadboard-node --version
          /usr/local/bin/leadboard-node -p 'process.execPath'
          echo "possible npm locations:"
          find /usr/local /opt /home/admin -maxdepth 5 -type f -path '*/bin/npm-cli.js' -o -type f -path '*/bin/npm' 2>/dev/null | head -50
