services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadboard
      POSTGRES_PASSWORD: leadboard
      POSTGRES_DB: leadboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadboard -d leadboard"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
